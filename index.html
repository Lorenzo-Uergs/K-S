<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K&S — Simulador</title>
  <meta name="color-scheme" content="light dark" />
  <script>try{const s=localStorage.getItem("ks-theme");const p=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme", s||p);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__title">Simulador K&amp;S</div>
        <div class="brand__tag">Arquitetura · Conjunto K&amp;S · 32 linhas</div>
      </div>
      <div class="topbar__actions">
        <button id="theme_toggle" class="theme-toggle" type="button" aria-label="Alternar tema">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
        <div class="topbar__meta">
          Feito por <strong>Lucas Schwalm</strong> · ajustado por
          <a href="https://github.com/Lorenzo-Uergs" target="_blank" rel="noopener noreferrer">Lorenzo Garcia Bernardes</a>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- Registradores -->
    <section class="registers" aria-label="Registradores">
      <div class="reg">
        <div class="reg__label">PC</div>
        <div class="reg__value" id="val-pc">00</div>
      </div>
      <div class="reg">
        <div class="reg__label">ALU</div>
        <div class="reg__value" id="val-alu">0</div>
      </div>
      <div class="reg">
        <div class="reg__label">R0</div>
        <div class="reg__value" id="val-r0">0</div>
      </div>
      <div class="reg">
        <div class="reg__label">R1</div>
        <div class="reg__value" id="val-r1">0</div>
      </div>
      <div class="reg">
        <div class="reg__label">R2</div>
        <div class="reg__value" id="val-r2">0</div>
      </div>
      <div class="reg">
        <div class="reg__label">R3</div>
        <div class="reg__value" id="val-r3">0</div>
      </div>
    </section>

    <!-- Controles -->
    <section class="controls" aria-label="Controles">
      <div class="controls__group">
        <button id="play_button" class="btn btn--primary" type="button" aria-label="Executar / Pausar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 2.2L11 7L3 11.8V2.2Z" fill="currentColor"/></svg>
          <span>Executar</span>
        </button>
        <button id="exec_button" class="btn btn--ghost" type="button">Executar tudo</button>
        <button id="next_button" class="btn btn--ghost" type="button">Passo</button>
      </div>

      <div class="controls__divider" aria-hidden="true"></div>

      <div class="controls__group">
        <button id="reset_button" class="btn btn--quiet" type="button">Resetar</button>
        <button id="save_button" class="btn btn--quiet" type="button">Salvar .txt</button>
        <label for="load_file_input" class="btn btn--quiet" style="cursor:pointer;">
          Carregar
          <input type="file" id="load_file_input" class="file-input" accept=".txt,.asm" />
        </label>
      </div>

      <div class="controls__speed">
        <label for="speed">Velocidade</label>
        <input type="range" id="speed" min="100" max="1900" value="1500" />
      </div>
    </section>

    <div id="exec-status" class="exec-status" role="status" aria-live="polite"></div>

    <!-- Editor -->
    <section class="editor" aria-label="Editor de código">
      <div class="editor__gutter" id="line-numbers" aria-hidden="true"></div>
      <textarea id="input" class="editor__input" rows="32" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Código assembly — 32 linhas">LOAD R1 10
LOAD R2 11
ADD R0 R1 R2
STORE 12 R0
HALT





15
25</textarea>
    </section>

    <footer class="foot">
      <span>Instruções: <code>LOAD</code> · <code>STORE</code> · <code>MOVE</code> · <code>ADD</code> · <code>SUB</code> · <code>AND</code> · <code>OR</code> · <code>BRANCH</code> · <code>BZERO</code> · <code>BNEG</code> · <code>HALT</code> · <code>NOP</code> — memória 0–31, registradores R0–R3.</span>
      <span>32 linhas · PC 00–31</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
